---
# ==============================================================
# Ansible Inventory - Homelab Infrastructure
# ==============================================================
# Definiuje serwery którymi zarządzamy przez Ansible
# Uruchomienie: ansible-playbook -i inventory/hosts.yml playbooks/base-setup.yml
# ==============================================================

all:
  children:
    # ---- Grupa serwerów homelab ----
    homelab:
      hosts:
        # Ubuntu server na Proxmox
        ubuntu-server:
          ansible_host: 10.0.0.10          # IP serwera
          ansible_user: emes                # Twój user (ZMIEŃ jeśli inny!)
          ansible_connection: local         # Uruchamiamy lokalnie (nie przez SSH)
          ansible_become: true              # Używaj sudo
          ansible_become_method: sudo       # Metoda: sudo

      # ---- Zmienne wspólne dla całej grupy ----
      vars:
        environment_type: homelab
        timezone: Europe/Warsaw
